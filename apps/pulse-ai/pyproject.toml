[project]
name = "ziro-pulse-ai"
version = "0.1.0"
description = "Ziro Pulse — Semantic pgvector search, AI COD-RTO Shield, and UCP/ACP agentic commerce layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "numpy>=2.0.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.3.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
