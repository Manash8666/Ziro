name: Stage 4 Production Hardening Gate

on:
  push:
    branches: [main, 'feat/ziro-*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-and-sandbox-invariants:
    name: License Audit & Public Sandbox Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Open Source Licenses (100% Permissive, Zero GPL/AGPL)
        run: pnpm licenses list

      - name: Verify Public Sandbox Invariants & 0% Platform Fee Shield
        run: node --experimental-strip-types scripts/seed-public-sandbox.ts --verify-only

  test-and-hil-suite:
    name: Unit, Integration & Hardware-in-the-Loop Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/pulse-ai[dev]

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Monorepo Test Suites
        run: pnpm test

      - name: Run Pytest Pulse AI Suite (Embeddings, RTO, KYA, UCP, ACP)
        run: python -m pytest apps/pulse-ai/tests -v

      - name: Run Hardware-in-the-Loop & Signed Webhook Verification
        run: pnpm verify:hil

  typecheck-and-build:
    name: TypeScript Typecheck & Monorepo Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Monorepo Packages
        run: pnpm typecheck

      - name: Build All Monorepo Applications & Libraries
        run: pnpm build
