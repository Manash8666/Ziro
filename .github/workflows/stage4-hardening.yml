name: Stage 4 Production Hardening Gate

on:
  push:
    branches: [main, 'feat/ziro-*']
  pull_request:
    branches: [main]

jobs:
  hardening-and-verification:
    name: Monorepo Quality, License & Performance Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/pulse-ai/requirements.txt

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Open Source Licenses (Zero GPL/AGPL Contamination)
        run: pnpm licenses list

      - name: Typecheck TypeScript Packages
        run: pnpm typecheck

      - name: Run Vitest Unit & Integration Suites
        run: pnpm test

      - name: Run Pytest Pulse AI Suite
        run: python -m pytest apps/pulse-ai/tests -v

      - name: Run Hardware-in-the-Loop & Signed Webhook Verification
        run: pnpm verify:hil

      - name: Build All Monorepo Applications & Libraries
        run: pnpm build
