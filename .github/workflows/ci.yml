name: CI

on:
  push:
    branches:
      - main
      - feat/ziro-phase-1
  pull_request:
    branches:
      - main
      - feat/ziro-phase-1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify infrastructure assertions
        run: node --test tests/infra.test.mjs

      - name: Typecheck packages and apps
        run: pnpm typecheck

      - name: Build packages and apps
        run: pnpm build

      - name: Run TypeScript test suite
        run: pnpm test

  pulse-ai:
    name: Pulse AI (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/pulse-ai/pyproject.toml

      - name: Install Pulse AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./apps/pulse-ai pytest pytest-asyncio

      - name: Run Pulse AI pytest suite
        run: pytest apps/pulse-ai/tests -v
